services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: fluxguard-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  init-kafka:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic fluxguard-events \
          --partitions 3 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic fluxguard-anomalies \
          --partitions 3 \
          --replication-factor 1

        echo "Kafka topics initialized successfully"
    restart: "no"

  api:
    image: ${FLUXGUARD_API_IMAGE:-fluxguard-api:local}
    build:
      context: .
      target: api
    container_name: fluxguard-api
    environment:
      FLUXGUARD_HTTP_PORT: "8080"
      FLUXGUARD_KAFKA_BROKER: "kafka:9092"
      FLUXGUARD_KAFKA_TOPIC: "fluxguard-events"
      FLUXGUARD_KAFKA_ANOMALY_TOPIC: "fluxguard-anomalies"
    ports:
      - "8080:8080"
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    restart: unless-stopped

  processor:
    image: ${FLUXGUARD_PROCESSOR_IMAGE:-fluxguard-processor:local}
    build:
      context: .
      target: processor
    container_name: fluxguard-processor
    environment:
      FLUXGUARD_KAFKA_BROKER: "kafka:9092"
      FLUXGUARD_KAFKA_TOPIC: "fluxguard-events"
      FLUXGUARD_KAFKA_ANOMALY_TOPIC: "fluxguard-anomalies"
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    restart: unless-stopped