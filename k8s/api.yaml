apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxguard-api
  namespace: fluxguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluxguard-api
  template:
    metadata:
      labels:
        app: fluxguard-api
    spec:
      containers:
        - name: api
          image: fluxguard-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: FLUXGUARD_HTTP_PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: fluxguard-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080

apiVersion: v1
kind: Service
metadata:
  name: fluxguard-api
  namespace: fluxguard
spec:
  selector:
    app: fluxguard-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP